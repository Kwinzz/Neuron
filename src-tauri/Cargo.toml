[package]
name = "neuron"
version = "0.2.9"
description = "Neuron — unified desktop cockpit for CLI AI agents"
edition = "2024"
rust-version = "1.85"

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows.
name = "neuron_lib"
# Desktop only: the binary links the rlib. The template's "staticlib" / "cdylib" are only for Tauri mobile (iOS /
# Android) and doubled every build (the huge cdylib even crashed lld on Linux). Mobile: ["staticlib", "cdylib", "rlib"].
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.43", features = ["bundled"] }
thiserror = "2"
ts-rs = { version = "12", features = ["serde-json-impl"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2.7"
ignore = "0.4.30"
portable-pty = "0.9.0"
tauri-plugin-notification = "2.4"
vte = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
base64 = "0.22"
similar = "2"
sys-locale = "0.3"
dirs = "7"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
# Remote devices (see src/remote): QUIC connections dialed by public key, multi-interface mDNS discovery on the local
# network, SPAKE2 pairing code exchange.
iroh = { version = "1.5", default-features = false, features = ["tls-ring"] }
swarm-discovery = "0.6.6"
netwatch = "0.20"
n0-future = "0.3"
n0-watcher = "1"
data-encoding = "2"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
spake2 = "0.4"
blake3 = "1"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
winreg = "0.56"

# Keep dependencies optimized so SQLite & JSON parsing stay fast in dev builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
